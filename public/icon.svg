<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crayon / Oil Pastel Wobbly Texture Filter -->
    <filter id="crayon" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="crayon-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.06" numOctaves="3" seed="12" result="noise2" />
      <feDisplacementMap in="SourceGraphic" in2="noise2" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Warm Sketchbook Paper Background -->
  <rect width="512" height="512" rx="115" fill="#FFFDF7" />
  <rect x="14" y="14" width="484" height="484" rx="102" fill="#FFF7E8" stroke="#F4D39B" stroke-width="8" stroke-dasharray="18 8" filter="url(#crayon)" />

  <!-- Wobbly Crayon Arch Bridge over the Baby's Head -->
  <g filter="url(#crayon-rough)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Coral-Red Crayon Arch -->
    <path d="M 66 248 C 95 75, 415 72, 446 250" stroke="#E86F52" stroke-width="22" />
    <!-- Middle Sunny Yellow Crayon Arch -->
    <path d="M 86 256 C 118 106, 392 104, 424 258" stroke="#F6B93B" stroke-width="18" />
    <!-- Inner Mint/Sky Crayon Arch Bridge Rail -->
    <path d="M 108 265 C 140 135, 372 135, 404 266" stroke="#58B19F" stroke-width="15" />

    <!-- Little Crooked Bridge Pillars / Bricks Drawn by a Kid -->
    <line x1="150" y1="152" x2="142" y2="195" stroke="#E86F52" stroke-width="9" />
    <line x1="215" y1="115" x2="212" y2="160" stroke="#E86F52" stroke-width="9" />
    <line x1="295" y1="114" x2="298" y2="160" stroke="#E86F52" stroke-width="9" />
    <line x1="362" y1="150" x2="368" y2="195" stroke="#E86F52" stroke-width="9" />
  </g>

  <!-- Cute Crooked Crayon Baby Face in the Center -->
  <g filter="url(#crayon)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Baby Ears -->
    <circle cx="136" cy="336" r="26" fill="#FFE3C8" stroke="#5C4033" stroke-width="10" />
    <circle cx="376" cy="332" r="26" fill="#FFE3C8" stroke="#5C4033" stroke-width="10" />

    <!-- Chubby Wobbly Baby Head -->
    <path d="M 145 325 C 140 235, 372 232, 368 328 C 374 425, 320 452, 256 452 C 190 452, 138 420, 145 325 Z" fill="#FFE6CE" stroke="#5C4033" stroke-width="11" />

    <!-- Swirly Crayon Hair Curl on Top of Baby's Head -->
    <path d="M 248 250 C 232 212, 278 198, 282 225 C 285 242, 258 244, 265 226" fill="none" stroke="#5C4033" stroke-width="11" />

    <!-- Rosy Crayon Scribble Cheeks -->
    <ellipse cx="186" cy="362" rx="26" ry="18" fill="#FF8A80" opacity="0.75" />
    <ellipse cx="326" cy="360" rx="26" ry="18" fill="#FF8A80" opacity="0.75" />

    <!-- Loose, Happy Doodle Eyes (One slightly bigger/crooked like a kid's drawing) -->
    <path d="M 196 318 Q 210 302 224 318" fill="none" stroke="#4A3222" stroke-width="11" />
    <circle cx="210" cy="324" r="7" fill="#4A3222" />
    <path d="M 288 316 Q 302 300 316 316" fill="none" stroke="#4A3222" stroke-width="11" />
    <circle cx="302" cy="322" r="7" fill="#4A3222" />

    <!-- Tiny Button Nose -->
    <path d="M 252 338 Q 260 346 254 352" fill="none" stroke="#5C4033" stroke-width="9" />

    <!-- Big Goofy, Carefree Baby Smile ("대충 웃고 있는 표정") with One Tiny Baby Tooth -->
    <path d="M 205 372 C 222 418, 294 416, 308 370" fill="#FF6B6B" stroke="#5C4033" stroke-width="11" />
    <!-- Single Cute Baby Tooth -->
    <rect x="248" y="376" width="18" height="15" rx="4" fill="#FFFFFF" stroke="#5C4033" stroke-width="6" />
  </g>
</svg>
